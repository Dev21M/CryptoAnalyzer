    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Suppress unhandled errors injected by third-party browser extensions and Vite HMR websocket drops
      window.addEventListener('error', function(e) {
        var src = (e.filename || '') + (e.message || '') + (e.error && e.error.stack ? e.error.stack : '');
        if (
          src.indexOf('moz-extension:') !== -1 ||
          src.indexOf('chrome-extension:') !== -1 ||
          src.indexOf('safari-extension:') !== -1 ||
          src.indexOf('.user.js') !== -1 ||
          src.indexOf('userscripts') !== -1 ||
          src.indexOf('__f__') !== -1 ||
          src.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
          src.indexOf('WebSocket closed without opened') !== -1
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : '';
        if (
          reason.indexOf('moz-extension:') !== -1 ||
          reason.indexOf('chrome-extension:') !== -1 ||
          reason.indexOf('.user.js') !== -1 ||
          reason.indexOf('userscripts') !== -1 ||
          reason.indexOf('__f__') !== -1 ||
          reason.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
          reason.indexOf('WebSocket closed without opened') !== -1
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>

  </body>
